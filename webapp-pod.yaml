#create pod file for kubernetes flusk phyton app
apiVersion: v1
kind: Pod
metadata:
  name: webapp
  labels:
    app: webapp
    tier: frontend
spec:
  containers:
    - name: webapp
      image: webapp:v1
#buraya kadar standart ve doğru geldik
      
      ports:
        - containerPort: 5000
      envFrom:
        - configMapRef:
            name: webapp-configmap
            
            