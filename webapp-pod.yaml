#create pod file for kubernetes flusk phyton app
apiVersion: v1
kind: Pod
metadata:
  name: webapp
  labels:
    app: webapp
    tier: frontend
spec:
  containers:
    - name: webapp
      image: webapp:v1
#buraya kadar standart ve doğru geldik
      
      ports:
        - containerPort: 5000
      env:
        - name: MONGO_URL
          value: "mongodb://beyto:Beyto1905.@mongo-service:27017/?authSource=admin"
        - name: MONGO_DB
          value: "mydb" 