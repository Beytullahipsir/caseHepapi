# Storage for mongodb
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Release.Name }}-sc
provisioner: k8s.io/minikube-hostpath
#işi yapan csi her path için farklı provisioner var minikube-hostpath bizimki 
#parameters:
#  type: ???
#  fstype: ??? GEREK YOK LOCAL için bu ayarlamalara

reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
