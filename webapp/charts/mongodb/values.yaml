replicaCount: 1
tier: backend

image:
  repository: "mongo"
  tag: "latest"
  #pullPolicy: IfNotPresent bu lazım değil v1 var bizde !!
  targetPort: 27017

service:
  type: ClusterIP
  port: 27017

storage:
  size: "500Mi"
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  allowVolumeExpansion: true
  provisioner: k8s.io/minikube-hostpath
  className: mystorage-sc

PVC:
  name: myclaim



