#NodePort service for webapp
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-webapp-service
  labels: 
    app: {{ .Release.Name }}-webapp
spec:
  type: NodePort
  selector:
    app: {{ .Release.Name }}-webapp
  ports:
    - targetPort: 5000 
      port: 5000 
      nodePort: 30080

