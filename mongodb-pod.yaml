#mongodb yaml file for kubernetes 
apiVersion: v1
kind: Pod
metadata:
  name: mongodb
  labels:
    app: mongodb
    tier: backend
spec:
  containers:
    - name: mongodb
      image: mongo
      ports:
        - containerPort: 27017
      env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "beyto"
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: "Beyto1905."