name: cd for webapp

on:
  push:
    branches: main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start minikube
        uses: medyagh/setup-minikube@latest

      - name: Build image 
        run: |
          eval $(minikube docker-env)
          docker build -t webapp:v1 .

      - name:  Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Update Helm dependencies
        run: helm dependency update webapp/flask-mongo

      - name: Deploy with Helm
        run: helm upgrade --install case webapp/flask-mongo --wait --timeout 60s