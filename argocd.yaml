apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: casehepapi
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Beytullahipsir/caseHepapi.git
    targetRevision: main
    path: webapp

  destination:
    server: https://kubernetes.default.svc
    namespace: default 

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true