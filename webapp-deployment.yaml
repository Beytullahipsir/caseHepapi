#deployment file for webapp
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  
  template:
    metadata:
      name: webapp
      labels:
        app: webapp
        tier: frontend
    spec:
      containers:
        - name: webapp
          image: webapp:v1
    #buraya kadar standart ve doğru geldik
          
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URL
              value: "mongodb://beyto:Beyto1905.@mongo-service:27017/?authSource=admin"
            - name: MONGO_DB
              value: "mydb"  